name: Verify project
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests backend/tests/test_offline.py -q
      - run: node tests/test_frontend.cjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spherex-flipbook .
      - name: Run container and wait for /api/health
        run: |
          docker run -d --name sx -e PYTHONUNBUFFERED=1 -p 8080:8080 spherex-flipbook
          for i in $(seq 1 100); do
            if curl -sf -m 5 localhost:8080/api/health; then echo; echo "healthy after ~$((i*3))s"; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' sx)" != "true" ]; then echo "container exited"; break; fi
            sleep 3
          done
          docker ps -a; docker logs sx; exit 1
