name: Verify project
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests backend/tests/test_offline.py -q
      - run: node tests/test_frontend.cjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spherex-flipbook .
      - run: |
          docker run -d --name sx -p 8080:8080 spherex-flipbook
          for i in $(seq 1 40); do curl -sf localhost:8080/api/health && exit 0; sleep 3; done
          docker logs sx; exit 1
