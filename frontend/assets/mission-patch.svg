<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="patchTitle patchDesc">
  <title id="patchTitle">Project Flipbook mission patch, Team Overdrive</title>
  <desc id="patchDesc">Original team patch: a circular embroidered emblem with three offset flipbook frames on a starfield, a star stepping across the frames along a proper-motion arrow, a six-colour band for SPHEREx detectors D1 to D6, and the names of the four team members.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0042A6"/>
      <stop offset="1" stop-color="#07173F"/>
    </linearGradient>
    <linearGradient id="ir" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E96F5"/>
      <stop offset=".2" stop-color="#38C7C0"/>
      <stop offset=".4" stop-color="#9BD84E"/>
      <stop offset=".6" stop-color="#EAFE07"/>
      <stop offset=".8" stop-color="#F08A3C"/>
      <stop offset="1" stop-color="#E43700"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="300" cy="300" r="212"/></clipPath>
    <path id="arcTop" d="M 66 300 A 234 234 0 0 1 534 300"/>
    <path id="arcBottom" d="M 52 300 A 248 248 0 0 0 548 300"/>
    <path id="arcCrew" d="M 114 300 A 186 186 0 0 0 486 300"/>
  </defs>

  <!-- merrowed thread border -->
  <circle cx="300" cy="300" r="296" fill="#EAFE07"/>
  <circle cx="300" cy="300" r="296" fill="none" stroke="#07173F" stroke-width="2" stroke-dasharray="3 5" opacity=".35"/>
  <circle cx="300" cy="300" r="284" fill="#07173F"/>

  <!-- lettering ring -->
  <text font-family="'Fira Sans', 'Arial Narrow', sans-serif" font-weight="900" font-size="38" letter-spacing="7" fill="#FFFFFF">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">PROJECT FLIPBOOK</textPath>
  </text>
  <text font-family="'Fira Sans', 'Arial Narrow', sans-serif" font-weight="700" font-size="27" letter-spacing="6" fill="#EAFE07">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">TEAM OVERDRIVE · 2026</textPath>
  </text>
  <!-- separator stars on the ring -->
  <g fill="#EAFE07">
    <path transform="translate(52 300) scale(.9)" d="M0-12 3-4 12-4 5 2 8 11 0 6-8 11-5 2-12-4-3-4Z"/>
    <path transform="translate(548 300) scale(.9)" d="M0-12 3-4 12-4 5 2 8 11 0 6-8 11-5 2-12-4-3-4Z"/>
  </g>

  <!-- inner field -->
  <circle cx="300" cy="300" r="216" fill="#FFFFFF"/>
  <circle cx="300" cy="300" r="212" fill="url(#field)"/>
  <g clip-path="url(#disc)">
    <!-- starfield (fixed positions) -->
    <g fill="#FFFFFF">
      <circle cx="140" cy="170" r="1.6"/><circle cx="196" cy="120" r="1.2"/><circle cx="262" cy="104" r="2"/>
      <circle cx="350" cy="118" r="1.3"/><circle cx="420" cy="150" r="1.8"/><circle cx="468" cy="214" r="1.2"/>
      <circle cx="122" cy="252" r="1.1"/><circle cx="478" cy="300" r="1.5"/><circle cx="160" cy="330" r="1.3"/>
      <circle cx="452" cy="372" r="1.1"/><circle cx="230" cy="168" r="1"/><circle cx="398" cy="96" r="1"/>
      <circle cx="316" cy="160" r="1.2"/><circle cx="108" cy="210" r="1"/><circle cx="496" cy="256" r="1"/>
    </g>
    <g transform="translate(0 -24)">
    <!-- orbit ellipse behind the frames -->
    <ellipse cx="300" cy="262" rx="196" ry="62" fill="none" stroke="#2E96F5" stroke-width="2" opacity=".55" transform="rotate(-14 300 262)"/>

    <!-- three flipbook frames: epochs 1, 2, 3 -->
    <g fill="#07173F" fill-opacity=".55" stroke="#FFFFFF" stroke-width="3">
      <rect x="168" y="150" width="128" height="128" rx="8" stroke-opacity=".35"/>
      <rect x="236" y="176" width="128" height="128" rx="8" stroke-opacity=".6"/>
      <rect x="304" y="202" width="128" height="128" rx="8"/>
    </g>
    <!-- the same star seen at three epochs, moving across the frames -->
    <circle cx="214" cy="204" r="7" fill="#FFFFFF" opacity=".4"/>
    <circle cx="298" cy="236" r="8" fill="#FFFFFF" opacity=".7"/>
    <g>
      <circle cx="382" cy="268" r="13" fill="#EAFE07" opacity=".25"/>
      <circle cx="382" cy="268" r="9" fill="#FFFFFF"/>
    </g>
    <!-- proper-motion arrow -->
    <path d="M 196 222 C 260 238 320 252 360 262" fill="none" stroke="#EAFE07" stroke-width="3.5" stroke-dasharray="7 6" stroke-linecap="round"/>
    <path d="M 352 250 L 372 265 L 349 272 Z" fill="#EAFE07"/>

    </g>
    <!-- six-band spectrum: SPHEREx detectors D1-D6, 0.75-5 µm -->
    <rect x="130" y="318" width="340" height="28" rx="3" fill="url(#ir)"/>
    <g stroke="#07173F" stroke-width="3"><line x1="186.7" y1="318" x2="186.7" y2="346"/><line x1="243.3" y1="318" x2="243.3" y2="346"/><line x1="300.0" y1="318" x2="300.0" y2="346"/><line x1="356.7" y1="318" x2="356.7" y2="346"/><line x1="413.3" y1="318" x2="413.3" y2="346"/></g>
    <g font-family="'Fira Code', 'Courier New', monospace" font-weight="700" font-size="14" fill="#07173F" text-anchor="middle"><text x="158.3" y="338">D1</text><text x="215.0" y="338">D2</text><text x="271.7" y="338">D3</text><text x="328.3" y="338">D4</text><text x="385.0" y="338">D5</text><text x="441.7" y="338">D6</text></g>
    <text x="300" y="370" font-family="'Fira Code', 'Courier New', monospace" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">0.75 – 5.0 µm · 102 BANDS</text>

    <!-- crew: the four tracks -->
    <text font-family="'Overpass', 'Arial', sans-serif" font-weight="700" font-size="17" letter-spacing="3" fill="#FFFFFF">
      <textPath href="#arcCrew" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">MALHAR · AKHILESH · AMRITA · SHANTANU</textPath>
    </text>
  </g>
</svg>
